name: "ESLint"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Use Node.js 
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: "pnpm"
      - name: install dependencies
        run: pnpm install
      - name: pnpm lint
        run: pnpm run lint